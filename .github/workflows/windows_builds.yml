name: 🏁 Windows Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
    "angle_libs=${{ github.workspace }}/"
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.18.0/"
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8
  # Beef toolchain source commit (Wc4ever/Beef, includes the LNK1170 fix). Built from source in CI.
  BEEF_REF: 8c4715340a

jobs:
  build-windows:
    # Pinned (not windows-latest) for a reproducible MSVC toolset: the Beef toolchain links IDEHelper
    # against a prebuilt LLVM that needs a matching recent MSVC STL, so a floating image that flips to a
    # newer/older toolset could break that link. GitHub Windows runners are Windows Server (not Win 10);
    # MSVC binaries built here still run on Windows 10+.
    runs-on: windows-2022
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Beef-enabled builds, mirroring how linux_builds.yml adds Mono cells. The Editor cell also
        # builds the Beef toolchain and assembles bin/BeefBundle (the self-contained BeefBuild/IDEHelper
        # the editor needs); templates don't need it (an exported game's runtime only loads the scripts).
        include:
          - name: Editor w/ Beef (target=editor)
            cache-name: windows-editor-beef
            target: editor
            scons-flags: module_beef_enabled=yes windows_subsystem=console
            bin: ./bin/godot.windows.editor.x86_64.beef.exe
            compiler: msvc
            build-beef: true
            bundle: true

          - name: Template w/ Beef, release (target=template_release)
            cache-name: windows-template-beef
            target: template_release
            scons-flags: module_beef_enabled=yes
            bin: ./bin/godot.windows.template_release.x86_64.beef.console.exe
            compiler: msvc
            build-beef: true

          - name: Template w/ Beef, debug (target=template_debug)
            cache-name: windows-template-beef-debug
            target: template_debug
            scons-flags: module_beef_enabled=yes
            bin: ./bin/godot.windows.template_debug.x86_64.beef.console.exe
            compiler: msvc
            build-beef: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.18.0
          file: accesskit-c-0.18.0.zip
          target: accesskit-c-0.18.0/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.18.0/accesskit_c.zip

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      # ---- Beef toolchain (Editor cell only) ----
      # Mirrors Beef's own bin/build.bat (Release subset). The lib the bootstrap links as
      # IDE\dist\BeefySysLib64.lib MUST be the import library of the DYNAMIC BeefySysLib64.dll
      # (BeefySysLib.vcxproj config Release): that config builds with BFP_NOEXPORT, so it imports the Bfp*
      # platform funcs from Beef042RT64 instead of redefining them (avoids LNK2005), and links the
      # font/input code into the DLL (avoids LNK1120 unresolved FTFont/DInput/DSound). Do NOT use the
      # static libs (BeefySysLib_static.vcxproj, or BeefySysLib.vcxproj "Release Static") -- both pull
      # Platform.obj's Bfp* in and drop the font/input impls, which is exactly what fails to link.
      # bin\msbuild.bat (vswhere -latest) picks a recent toolset whose STL matches the prebuilt LLVM that
      # IDEHelper links. Then BeefBoot bootstraps BeefBuild_boot.exe. Assembled into bin/BeefBundle below.
      - name: Set up MSVC (Beef toolchain)
        if: matrix.bundle
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clone Beef toolchain source (pinned)
        if: matrix.bundle
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/Wc4ever/Beef.git thirdparty/beef
          git -C thirdparty/beef checkout ${{ env.BEEF_REF }}

      - name: Cache Beef LLVM deps
        if: matrix.bundle
        id: beef-deps-cache
        uses: actions/cache@v4
        with:
          path: |
            thirdparty/beef/extern
            thirdparty/beef/BeefDep3_Done.txt
          key: beefdep3-${{ env.BEEF_REF }}

      - name: Download Beef LLVM deps
        if: matrix.bundle && steps.beef-deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: thirdparty/beef
        run: |
          if (-not (Test-Path BeefDep3_Done.txt)) {
            curl.exe -L -O https://www.beeflang.org/BeefDep3.zip
            tar.exe -xf BeefDep3.zip
            Remove-Item BeefDep3.zip
          }

      # Restore + save are split (not actions/cache) so the cache is saved ONLY when the build step
      # below succeeds: a plain actions/cache saves even on job failure, which previously poisoned the
      # cache with a half-built IDE/dist and made later runs skip the rebuild. The save step's implicit
      # success() guard prevents that. Bump the key suffix to invalidate any already-poisoned cache.
      - name: Restore Beef toolchain build
        if: matrix.bundle
        id: beef-build-cache
        uses: actions/cache/restore@v4
        with:
          path: thirdparty/beef/IDE/dist
          key: beeftc-${{ env.BEEF_REF }}-${{ runner.os }}-v4

      - name: Build Beef toolchain (mirrors bin/build.bat, Release subset)
        if: matrix.bundle && steps.beef-build-cache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: thirdparty/beef
        run: |
          rem BeefySysLib config=Release is the DYNAMIC build -> IDE\dist\BeefySysLib64.dll + its import
          rem lib IDE\dist\BeefySysLib64.lib (the lib the bootstrap links). No rename needed.
          call bin\msbuild.bat BeefySysLib\BeefySysLib.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /v:m || exit /b 1
          call bin\msbuild.bat IDEHelper\IDEHelper.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /v:m || exit /b 1
          call bin\msbuild.bat BeefRT\BeefRT.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /v:m || exit /b 1
          call bin\msbuild.bat BeefBoot\BeefBoot.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SolutionDir=%CD%\ /v:m || exit /b 1
          IDE\dist\BeefBoot.exe -O0 --out="IDE\dist\BeefBuild_boot.exe" --src=BeefBuild\src --src=BeefLibs\corlib\src --src=BeefLibs\Beefy2D\src --src=IDE\src --src=BeefLibs\libgit2\src --define=CLI --define=RELEASE --startup=BeefBuild.Program --linkparams="Comdlg32.lib kernel32.lib user32.lib advapi32.lib shell32.lib IDE\dist\Beef042RT64.lib IDE\dist\IDEHelper64.lib IDE\dist\BeefySysLib64.lib" || exit /b 1
          rem Resident-compiler wrapper (GodotBeefBuild.dll): a warm in-process BeefBuild the editor
          rem loads for fast incremental builds. Source is tracked in the godot module; stage it as a
          rem BeefBuild sibling (its BeefProj/BeefSpace use ../IDE, ../BeefBuild, ../BeefLibs) and build
          rem it with the just-bootstrapped BeefBuild. Scanner-off release runtime (see its BeefSpace).
          xcopy /E /I /Y ..\..\modules\beef\resident_builder BeefBuildLib >nul || exit /b 1
          IDE\dist\BeefBuild_boot.exe -proddir=BeefBuildLib -config=Release || exit /b 1

      - name: Save Beef toolchain build
        if: matrix.bundle && steps.beef-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: thirdparty/beef/IDE/dist
          key: ${{ steps.beef-build-cache.outputs.cache-primary-key }}

      - name: Assemble bin/BeefBundle
        if: matrix.bundle
        shell: pwsh
        run: |
          $beef = (Resolve-Path thirdparty/beef).Path
          $dist = Join-Path $beef "IDE/dist"
          $bundle = Join-Path (Resolve-Path .).Path "bin/BeefBundle"
          if (Test-Path $bundle) { Remove-Item -Recurse -Force $bundle }
          New-Item -ItemType Directory -Force "$bundle/bin", "$bundle/BeefLibs" | Out-Null
          Copy-Item "$dist/BeefBuild_boot.exe" "$bundle/bin/BeefBuild.exe" -Force
          Copy-Item "$dist/Beef042RT64.dll"   "$bundle/bin/" -Force
          Copy-Item "$dist/Beef042RT64.lib"   "$bundle/bin/" -Force
          Copy-Item "$dist/IDEHelper64.dll"   "$bundle/bin/IDEHelper64.dll" -Force
          # BeefBuild links BeefySysLib64.dll dynamically (import lib above) -> ship it next to BeefBuild.
          Copy-Item "$dist/BeefySysLib64.dll" "$bundle/bin/" -Force
          # Resident-compiler wrapper: the editor loads this next to BeefBuild.exe for warm incremental builds.
          Copy-Item "$dist/GodotBeefBuild.dll" "$bundle/bin/" -Force
          # The engine's in-process build needs bin/llvm/bin/lld-link.exe — copy the llvm root that holds it.
          $lld = Get-ChildItem -Path $beef -Recurse -Filter lld-link.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $lld) { throw "lld-link.exe not found under $beef" }
          Copy-Item $lld.Directory.Parent.FullName "$bundle/bin/llvm" -Recurse -Force
          if (-not (Test-Path "$bundle/bin/llvm/bin/lld-link.exe")) { throw "bundle missing bin/llvm/bin/lld-link.exe" }
          Copy-Item "$beef/BeefLibs/corlib" "$bundle/BeefLibs/corlib" -Recurse -Force
          "Version = 1`nUnversionedLibDirs = [`"../BeefLibs`"]" | Set-Content "$bundle/bin/BeefConfig.toml"

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          # Strip engine link leftovers from bin/ top level. No -Recurse, so bin/BeefBundle (incl. its
          # Beef042RT64.lib needed at runtime by the in-process build) is preserved.
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors
