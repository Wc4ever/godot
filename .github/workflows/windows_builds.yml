name: 🏁 Windows Builds
on:
  workflow_call:
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
    debug_symbols=no
    "angle_libs=${{ github.workspace }}/"
    "accesskit_sdk_path=${{ github.workspace }}/accesskit-c-0.18.0/"
  SCONS_CACHE_MSVC_CONFIG: true
  PYTHONIOENCODING: utf8
  # Pins the prebuilt BeefBundle release asset (tag beef-toolchain-<BEEF_REF>) the Editor cell downloads.
  # Bump this when you rebuild + republish the bundle for a new Beef version (built from Wc4ever/Beef).
  BEEF_REF: 8c4715340a

jobs:
  build-windows:
    # Pinned (not windows-latest) for a reproducible MSVC toolset: the Beef toolchain links IDEHelper
    # against a prebuilt LLVM that needs a matching recent MSVC STL, so a floating image that flips to a
    # newer/older toolset could break that link. GitHub Windows runners are Windows Server (not Win 10);
    # MSVC binaries built here still run on Windows 10+.
    runs-on: windows-2022
    name: ${{ matrix.name }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Beef-enabled builds, mirroring how linux_builds.yml adds Mono cells. The Editor cell also
        # builds the Beef toolchain and assembles bin/BeefBundle (the self-contained BeefBuild/IDEHelper
        # the editor needs); templates don't need it (an exported game's runtime only loads the scripts).
        include:
          - name: Editor w/ Beef (target=editor)
            cache-name: windows-editor-beef
            target: editor
            scons-flags: module_beef_enabled=yes windows_subsystem=console
            bin: ./bin/godot.windows.editor.x86_64.beef.exe
            compiler: msvc
            build-beef: true
            bundle: true

          - name: Template w/ Beef, release (target=template_release)
            cache-name: windows-template-beef
            target: template_release
            scons-flags: module_beef_enabled=yes
            bin: ./bin/godot.windows.template_release.x86_64.beef.console.exe
            compiler: msvc
            build-beef: true

          - name: Template w/ Beef, debug (target=template_debug)
            cache-name: windows-template-beef-debug
            target: template_debug
            scons-flags: module_beef_enabled=yes
            bin: ./bin/godot.windows.template_debug.x86_64.beef.console.exe
            compiler: msvc
            build-beef: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Download Direct3D 12 SDK components
        shell: sh
        id: d3d12-sdk
        run: |
          if python ./misc/scripts/install_d3d12_sdk_windows.py; then
            echo "D3D12_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Windows: Direct3D 12 SDK installation failed, building without Direct3D 12 support."
            echo "D3D12_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      - name: Download pre-built ANGLE static libraries
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: godotengine/godot-angle-static
          version: tags/chromium/6601.2
          file: godot-angle-static-x86_64-msvc-release.zip
          target: angle/angle.zip

      - name: Extract pre-built ANGLE static libraries
        run: Expand-Archive -Force angle/angle.zip ${{ github.workspace }}/

      - name: Download pre-built AccessKit
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          repo: AccessKit/accesskit-c
          version: tags/0.18.0
          file: accesskit-c-0.18.0.zip
          target: accesskit-c-0.18.0/accesskit_c.zip

      - name: Extract pre-built AccessKit
        run: unzip -o accesskit-c-0.18.0/accesskit_c.zip

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ matrix.scons-flags }} d3d12=${{ steps.d3d12-sdk.outputs.D3D12_ENABLED }}
          platform: windows
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      # ---- Beef toolchain bundle (Editor cell only) ----
      # The Beef toolchain (BeefBuild + IDEHelper + RT + llvm/lld-link + corlib) is built ONCE locally via
      # make_beef_bundle.bat and published as a GitHub Release asset, because its bootstrap link is tied to
      # the exact Beef lib configs and is fragile to reproduce on a clean runner. CI just downloads it.
      #
      # TO PUBLISH (once per Beef version, from a working local build):
      #   Compress-Archive -Path bin/BeefBundle -DestinationPath BeefBundle.zip
      #   gh release create beef-toolchain-<BEEF_REF> BeefBundle.zip --repo <this repo>
      # Then bump BEEF_REF below (env) to match the tag. The IDEHelper64.dll in the bundle MUST be the
      # same Beef commit (hot-reload requires it), which the tag pins.
      - name: Download prebuilt BeefBundle
        if: matrix.bundle
        uses: dsaltares/fetch-gh-release-asset@1.1.2
        with:
          version: tags/beef-toolchain-${{ env.BEEF_REF }}
          file: BeefBundle.zip
          target: BeefBundle.zip

      - name: Unpack BeefBundle into bin/
        if: matrix.bundle
        shell: pwsh
        run: |
          Expand-Archive -Force BeefBundle.zip bin/
          if (-not (Test-Path bin/BeefBundle/bin/BeefBuild.exe)) {
            throw "BeefBundle.zip did not contain bin/BeefBundle/bin/BeefBuild.exe"
          }

      - name: Prepare artifact
        if: matrix.compiler == 'msvc'
        run: |
          # Strip engine link leftovers from bin/ top level. No -Recurse, so bin/BeefBundle (incl. its
          # Beef042RT64.lib needed at runtime by the in-process build) is preserved.
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload artifact
        if: matrix.compiler == 'msvc'
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors
